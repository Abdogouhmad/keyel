[package]
name = "rust_lib_keyel"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
keyel_core = { path = "../crates/keyel_core" }
uuid = "1.29.1"
zeroize = "1.8"
data-encoding = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
