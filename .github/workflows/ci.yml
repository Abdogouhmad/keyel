name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pinned to the version the project is developed and verified against. CI ran
  # green on 3.47.9; drifting to stable 3.50.0 broke the Android Gradle Plugin
  # check (needs AGP 9.1.1) and the cargokit Rust build on Windows.
  FLUTTER_VERSION: 3.47.9

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (RustSec advisories)
        run: cargo audit
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny check

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Rust toolchain for bridge check
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Regenerate FRB bindings and fail if out of date
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          # Must match build.sh: generate WITHOUT --no-web, because the committed
          # bindings include the web module (frb_generated.web.dart + `mod web`).
          # Generating with --no-web strips it and the diff check fails.
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs \
            || (echo "::error::Generated FRB bindings are out of date. Run 'flutter_rust_bridge_codegen generate' and commit the result." && exit 1)
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  flutter-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Rust toolchain with android target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android
      - name: Build debug APK (debug only, device matrix in roadmap 0.11)
        run: flutter build apk --debug --target-platform android-arm64
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyel-debug-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Desktop targets can only be built on their own OS (Flutter registers only
  # the host desktop target), so each runs on its native runner. cargokit
  # installs the Rust target it needs; macOS builds are ad-hoc signed
  # (CODE_SIGN_IDENTITY = "-"), so no certificate is required.
  #
  # Windows is pinned to `windows-2022` as a precaution: `windows-latest` (and
  # `windows-2025`) currently serve the beta `windows-2025-vs2026` image
  # (Visual Studio 18, CMake 4.x; actions/runner-images#14004). That image is
  # not what broke this build — the earlier cargokit failure was a relative-path
  # bug in rust_builder/windows/CMakeLists.txt (see docs/DECISIONS.md) and
  # reproduced on the 2022 image too — but the pin keeps the job on the stable,
  # verified VS 2022 toolchain while the VS 2026 image settles.
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: keyel-linux-x64
            bundle: build/linux/x64/release/bundle
          - os: windows-2022
            target: windows
            artifact: keyel-windows-x64
            bundle: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: keyel-macos
            bundle: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Build ${{ matrix.target }} desktop bundle
        run: flutter build ${{ matrix.target }} --release
      - name: Capture the real Windows build error (cargokit)
        # `flutter build windows` filters MSBuild output, so a cargokit failure
        # only shows as an opaque `MSB8066 ... exited with code -1`
        # (flutter/flutter#194906). On failure, re-run verbosely and surface the
        # lines that explain what actually went wrong.
        if: failure() && matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release -v 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\verbose.log"
          $patterns = 'cargokit|CARGOKIT|SEVERE|Exception|pub get|exited with code'
          Select-String -Path "$env:RUNNER_TEMP\verbose.log" -Pattern $patterns -Context 2,2 | Select-Object -Last 160 | Out-String -Width 400
      - name: Upload ${{ matrix.target }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
