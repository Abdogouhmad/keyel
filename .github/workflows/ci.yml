name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (RustSec advisories)
        run: cargo audit
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny check

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rust toolchain for bridge check
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Regenerate FRB bindings and fail if out of date
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          flutter_rust_bridge_codegen generate --no-web
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs \
            || (echo "::error::Generated FRB bindings are out of date. Run 'flutter_rust_bridge_codegen generate' and commit the result." && exit 1)
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  flutter-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rust toolchain with android target
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android
      - name: Build debug APK (debug only, device matrix in roadmap 0.11)
        run: flutter build apk --debug --target-platform android-arm64
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyel-debug-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Desktop targets can only be built on their own OS (Flutter registers only
  # the host desktop target), so each runs on its native runner. cargokit
  # installs the Rust target it needs; macOS builds are ad-hoc signed
  # (CODE_SIGN_IDENTITY = "-"), so no certificate is required.
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: keyel-linux-x64
            bundle: build/linux/x64/release/bundle
          - os: windows-latest
            target: windows
            artifact: keyel-windows-x64
            bundle: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: keyel-macos
            bundle: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build ${{ matrix.target }} desktop bundle
        run: flutter build ${{ matrix.target }} --release
      - name: Upload ${{ matrix.target }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
