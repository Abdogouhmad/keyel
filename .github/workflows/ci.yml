name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Rust targets for bridge check
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Regenerate FRB bindings and fail if out of date
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          flutter_rust_bridge_codegen generate --no-web
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs \
            || (echo "::error::Generated FRB bindings are out of date. Run 'flutter_rust_bridge_codegen generate' and commit the result." && exit 1)
      - name: flutter analyze
        run: flutter analyze
      - name: flutter test
        run: flutter test

  flutter-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: rustup android targets
        run: rustup target add aarch64-linux-android
      - name: Build debug APK (debug only, device matrix in roadmap 0.11)
        run: flutter build apk --debug --target-platform android-arm64
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyel-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
