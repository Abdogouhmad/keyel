name: release

# Builds and publishes releases from `main` (a push touching `pubspec.yaml` or
# `CHANGELOG.md` is ALWAYS the stable channel), plus manual runs via
# workflow_dispatch. Both channels share this pipeline but use different
# versions, release flags and OTA manifests:
#
#   STABLE — automatic on a version-bump push, or channel=stable dispatch.
#     `version:` in pubspec.yaml is the source of truth and the notes are the
#     matching `## [<version>]` CHANGELOG.md section. Publishes a normal GitHub
#     release and rewrites update_manifest.json.
#
#   BETA — manual workflow_dispatch only, channel=beta. Supply `beta_version`
#     (semver, e.g. 1.9.0-beta.1) and optionally `beta_notes` (markdown).
#     pubspec.yaml and CHANGELOG.md are NOT touched, and a push NEVER
#     publishes a beta. The tag `v<beta_version>` is created server-side, the
#     GitHub release is marked --prerelease, and the OTA manifest is the
#     separate update_manifest_beta.json. versionCode comes from the semver
#     core only (1.9.0-beta.1 -> 10900); a prerelease suffix is a version-name
#     detail and is not a numeric versionCode component.
#
#   Every platform ships from one trigger:
#     - Android: split-per-abi arm64-v8a + armeabi-v7a and a universal APK
#       (the universal one is what the in-app OTA updater always downloads, and
#       its asset name + sha256 land in update_manifest.json).
#     - Linux (x64): a portable .tar.gz bundle and a runnable .AppImage.
#     - Windows (x64): a portable .zip AND a real .exe installer (Inno Setup),
#       so a user can double-click to install rather than unpack an archive.
#     - macOS (universal x86_64+arm64): a .app .zip AND a drag-to-install .dmg.
#   All artifacts plus a SHA-256 `checksums.txt` are attached to the GitHub
#   release: notes are the matching `## [<version>]` CHANGELOG.md section for
#   stable, or the operator's `beta_notes` for beta, used verbatim (also copied
#   into that channel's manifest `releaseNotes`). Each manifest carries
#   `channel` and `isPrerelease`, and the universal APK is SHA-256/size-checked
#   against the manifest of the channel that was actually published.
#
#   Signs-policy (Android refuses to install an UNSIGNED release APK and refuses
#   a "signature update" over a differently-signed app): every APK is signed with
#   the SAME stable keystore provisioned from the KEYEL_* secrets, the build
#   FAILS when the secrets are missing (never ship unsigned/debug again), and
#   build.sh verifies every APK's signature with apksigner — plus the
#   password-manager policy (not debuggable, allowBackup="false") — before
#   anything is published.
#
# Caching: Flutter SDK, pub, Gradle, the Rust target dir and the compiled
# flutter_rust_bridge_codegen binary are all restored between runs, so a release
# is dominated by the actual compiles rather than by re-downloading or
# re-compiling tooling.
#
# To release a new STABLE version:
#   1. Bump `version:` in pubspec.yaml.
#   2. Add a `## [<version>]` section to CHANGELOG.md.
#   3. Merge onto main — the tag, GitHub release and stable OTA manifest follow.
#
# To publish a BETA:
#   1. Actions → release → Run workflow → channel=beta (never on push).
#   2. Enter beta_version and, ideally, beta_notes; no version bump or
#      CHANGELOG entry is needed.
#   3. The prerelease, its tag and update_manifest_beta.json follow; only that
#      manifest is committed back, so stable users are unaffected.
#
# Secrets to configure in the repo (Settings → Secrets and variables → Actions):
#   KEYEL_KEYSTORE_BASE64   = base64 of the keyel-release.jks keystore
#   KEYEL_KEYSTORE_PASSWORD = keystore password
#   KEYEL_KEY_ALIAS         = signing key alias
#   KEYEL_KEY_PASSWORD      = signing key password

on:
  push:
    branches:
      - main
    # A docs-only or workflow-only commit cannot change the shipped artifacts,
    # so it must not spin up a full signed release. `pubspec.yaml` and
    # `CHANGELOG.md` are exactly the files a version bump touches.
    paths:
      - 'pubspec.yaml'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (beta is a manual prerelease; pushes to main are always stable)'
        type: choice
        options:
          - stable
          - beta
        default: stable
      beta_version:
        description: 'Beta version only, semver e.g. 1.9.0-beta.1 (required when channel=beta; ignored for stable)'
        type: string
        required: false
        default: ''
      beta_notes:
        description: 'Beta release notes (markdown). When empty, a matching CHANGELOG.md section is required.'
        type: string
        required: false
        default: ''

# A newer commit on the same branch makes an in-flight release obsolete.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Keep in lockstep with ci.yml: the version the project is developed and
  # verified against. Flutter and AGP must be upgraded together.
  FLUTTER_VERSION: 3.47.9
  FRB_CODEGEN_VERSION: 2.13.0

  # Channel selection for EVERY job (android/desktop/publish), so one dispatch
  # drives the version, notes, tag, release flag and manifest everywhere.
  # Pushes to main never carry inputs, so they always resolve to stable and
  # to an empty override -> build.sh keeps deriving from pubspec.yaml.
  KEYEL_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
  # Only a beta dispatch sets an override; stable deliberately leaves it empty.
  KEYEL_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'beta' && inputs.beta_version || '' }}
  KEYEL_RELEASE_NOTES: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'beta' && inputs.beta_notes || '' }}

jobs:
  # ── Android: signed, verified APKs ──────────────────────────────────────────
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the tag operations in publish never race a shallow
          # clone.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # build.sh runs the FULL pipeline in CI (fmt/clippy/test/audit, analyze/
      # test and FRB regeneration), so its extra tools must be present.
      # taiki-e/install-action fetches a prebuilt cargo-audit (no compile).
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # flutter_rust_bridge_codegen is a slow `cargo install`; cache the built
      # binary so only the first run (or a version bump) pays for it.
      - name: Cache flutter_rust_bridge_codegen
        id: frb-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-${{ env.FRB_CODEGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install flutter_rust_bridge_codegen
        if: steps.frb-cache.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_CODEGEN_VERSION }} --locked

      # Provisions the stable keystore from the KEYEL_* secrets (fails the build
      # when they are missing), builds the split-per-abi + universal APKs, stages
      # versioned copies under dist/, writes checksums.txt, and verifies every
      # APK's signature and policy.
      - name: Build, sign and stage APKs
        env:
          KEYEL_KEYSTORE_BASE64: ${{ secrets.KEYEL_KEYSTORE_BASE64 }}
          KEYEL_KEYSTORE_PASSWORD: ${{ secrets.KEYEL_KEYSTORE_PASSWORD }}
          KEYEL_KEY_ALIAS: ${{ secrets.KEYEL_KEY_ALIAS }}
          KEYEL_KEY_PASSWORD: ${{ secrets.KEYEL_KEY_PASSWORD }}
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: keyel-android
          path: dist/*.apk
          if-no-files-found: error

  # ── Desktop: Linux / Windows / macOS bundles ────────────────────────────────
  # Desktop targets can only be built on their own OS (Flutter registers only
  # the host desktop target), so each runs on its native runner. cargokit
  # installs the Rust target it needs; macOS builds are ad-hoc signed
  # (CODE_SIGN_IDENTITY = "-"), so no certificate is required.
  #
  # Windows is pinned to `windows-2022` as a precaution: `windows-latest` (and
  # `windows-2025`) currently serve the beta `windows-2025-vs2026` image
  # (Visual Studio 18, CMake 4.x; actions/runner-images#14004). That image is
  # not what broke this build — the earlier cargokit failure was a relative-path
  # bug in rust_builder/windows/CMakeLists.txt (see docs/DECISIONS.md) and
  # reproduced on the 2022 image too — but the pin keeps the job on the stable,
  # verified VS 2022 toolchain while the VS 2026 image settles.
  desktop:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: keyel-linux-x64
            bundle: build/linux/x64/release/bundle
          - os: windows-2022
            target: windows
            artifact: keyel-windows-x64
            bundle: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact: keyel-macos-universal
            bundle: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.target }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev \
            file squashfs-tools desktop-file-utils

      - name: Determine version
        id: version
        shell: bash
        # `bash ./build.sh` (not `./build.sh`) so the Windows runner does not
        # depend on the executable bit surviving checkout.
        run: bash ./build.sh --detect-version >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.target }} desktop bundle
        run: flutter build ${{ matrix.target }} --release

      - name: Capture the real Windows build error (cargokit)
        # `flutter build windows` filters MSBuild output, so a cargokit failure
        # only shows as an opaque `MSB8066 ... exited with code -1`
        # (flutter/flutter#194906). On failure, re-run verbosely and surface the
        # lines that explain what actually went wrong.
        if: failure() && matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release -v 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\verbose.log"
          $patterns = 'cargokit|CARGOKIT|SEVERE|Exception|pub get|exited with code'
          Select-String -Path "$env:RUNNER_TEMP\verbose.log" -Pattern $patterns -Context 2,2 | Select-Object -Last 160 | Out-String -Width 400

      - name: Package Linux bundle
        if: matrix.target == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/keyel-v${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            -C "${{ matrix.bundle }}" .

      # appimagetool is downloaded and extracted by the helper, so no FUSE2 is
      # needed on the runner and no third-party binary is committed to the repo.
      - name: Build Linux AppImage (.AppImage)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          bash ./tool/build_linux_appimage.sh \
            --bundle "${{ matrix.bundle }}" \
            --version "${{ steps.version.outputs.version }}" \
            --output "dist/keyel-v${{ steps.version.outputs.version }}-linux-x64.AppImage"

      - name: Package Windows bundle
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "${{ matrix.bundle }}\*" `
            -DestinationPath "dist/keyel-v${{ steps.version.outputs.version }}-windows-x64.zip"

      # A `.zip` is not something a Windows user can just double-click and
      # install, so build a real installer too: Inno Setup (preinstalled on the
      # windows-2022 runner image) wraps the whole bundle into a single
      # `keyel-v<ver>-windows-x64-setup.exe` with an uninstaller, Start-menu
      # entries and an optional desktop shortcut.
      - name: Build Windows installer (.exe)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe (Inno Setup) not found on the runner" }
          $bundle = (Resolve-Path "${{ matrix.bundle }}").Path
          $out = (Resolve-Path dist).Path
          & $iscc.FullName `
            "/DKeyelVersion=${{ steps.version.outputs.version }}" `
            "/DKeyelBundle=$bundle" `
            "/DKeyelOut=$out" `
            "packaging\windows\keyel.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Package macOS bundle
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          # Flutter builds macOS with ARCHS_STANDARD, so the app (and cargokit's
          # Rust framework) is a UNIVERSAL x86_64+arm64 binary; `ditto` preserves
          # the symlinks and metadata a .app bundle needs and `--keepParent`
          # keeps `Keyel.app` as the top-level entry.
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ matrix.bundle }}/Keyel.app" \
            "dist/keyel-v${{ steps.version.outputs.version }}-macos-universal.zip"

      # A `.dmg` is the native macOS way to hand someone the app: open it and
      # drag Keyel onto the Applications symlink. `hdiutil` ships with macOS.
      - name: Build macOS disk image (.dmg)
        if: matrix.target == 'macos'
        run: |
          mkdir -p dist
          rm -rf build/dmg
          mkdir -p build/dmg
          ditto "${{ matrix.bundle }}/Keyel.app" build/dmg/Keyel.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Keyel" -srcfolder build/dmg -ov -format UDZO \
            "dist/keyel-v${{ steps.version.outputs.version }}-macos-universal.dmg"

      - name: Upload ${{ matrix.target }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ── Publish: tag + GitHub release + OTA manifest ────────────────────────────
  publish:
    name: publish
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the manifest commit and the tag never race a shallow
          # clone.
          fetch-depth: 0

      # Collect every artifact produced by the jobs above into one flat dist/.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: no secret logs
        run: |
          chmod +x ./tool/check_no_secret_logs.sh
          ./tool/check_no_secret_logs.sh

      - name: Determine version
        id: version
        run: |
          chmod +x ./build.sh
          ./build.sh --detect-version >> "$GITHUB_OUTPUT"

      # Stable: extract ONLY this release's `## [<version>]` section from
      # CHANGELOG.md (fails when missing so an unreleased change never ships).
      # Beta: build.sh writes KEYEL_RELEASE_NOTES verbatim instead; if those
      # are empty it falls back to the same strict CHANGELOG extraction.
      - name: 'Write release notes (stable = CHANGELOG / beta = beta_notes)'
        run: ./build.sh --release-notes

      - name: List staged artifacts
        run: ls -la dist

      # Collision-safe: re-running for the SAME version replaces the release at
      # the new commit. Delete the release (and, with it, the tag) when present,
      # and drop any stray tag that has no release (e.g. one pushed by hand).
      #
      # The tag is created SERVER-SIDE by `gh release create --target`. Pushing a
      # local tag from the checkout is what failed before:
      #   ! [remote rejected] v1.1.0 -> v1.1.0 (missing necessary objects)
      # --target points GitHub at a commit it already has, so no objects are
      # transferred and the ref is created atomically with the release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # A tag can exist without a release; 404 (already gone) is fine.
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" \
            >/dev/null 2>&1 || true

          # One checksums.txt covering EVERY published artifact (APKs, desktop
          # bundles and the installers). `keyel-*` deliberately excludes
          # dist/notes.md.
          (cd dist && sha256sum keyel-* > checksums.txt)
          cat dist/checksums.txt

          shopt -s nullglob
          apks=(dist/*.apk)          # arm64-v8a, armeabi-v7a, universal
          zips=(dist/*.zip)          # Windows portable + macOS .app
          tars=(dist/*.tar.gz)       # Linux portable bundle
          appimages=(dist/*.AppImage) # Linux runnable AppImage
          exes=(dist/*setup.exe)     # Windows installer
          dmgs=(dist/*.dmg)          # macOS disk image
          if (( ${#apks[@]} < 3 || ${#zips[@]} < 2 || ${#tars[@]} < 1 \
                || ${#appimages[@]} < 1 || ${#exes[@]} < 1 || ${#dmgs[@]} < 1 )); then
            echo "::error::Expected 3 APKs, 2 zips, 1 tarball, 1 .AppImage, 1 .exe installer and 1 .dmg; found: $(ls dist)"
            exit 1
          fi
          artifacts=(dist/*.apk dist/*.zip dist/*.tar.gz dist/*.AppImage dist/*setup.exe dist/*.dmg dist/checksums.txt)

          # Beta is a GitHub prerelease; stable keeps the exact original
          # `gh release create` invocation (no extra flag).
          PRERELEASE_ARGS=()
          if [[ "$KEYEL_CHANNEL" == beta ]]; then
            PRERELEASE_ARGS=(--prerelease)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "keyel ${{ steps.version.outputs.version }}" \
            --notes-file dist/notes.md \
            ${PRERELEASE_ARGS[@]+"${PRERELEASE_ARGS[@]}"} \
            "${artifacts[@]}"

      # Rewrite the OTA manifest for THIS channel: version, universal-APK URL
      # plus its fresh sha256/size, and this release's notes (never duplicated).
      # Stable -> update_manifest.json; beta -> update_manifest_beta.json, so a
      # prerelease can never be offered to stable users (or vice versa).
      - name: Update OTA manifest (${{ env.KEYEL_CHANNEL }})
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os

          version = os.environ["VERSION"]
          version_code = int(os.environ["VERSION_CODE"])
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          channel = os.environ["KEYEL_CHANNEL"]
          if channel not in ("stable", "beta"):
              raise SystemExit(f"Unsupported release channel: {channel}")
          is_prerelease = channel == "beta"
          manifest_path = "update_manifest_beta.json" if is_prerelease else "update_manifest.json"

          with open("dist/notes.md") as fh:
              release_notes = fh.read().strip()

          # The manifest is committed, so it may already exist (seeded or from a
          # previous release); start from {} so the very first release works too.
          try:
              with open(manifest_path) as fh:
                  manifest = json.load(fh)
          except FileNotFoundError:
              manifest = {}

          manifest["latestVersionName"] = version
          manifest["latestVersionCode"] = version_code
          manifest["minSupportedVersionCode"] = int(
              manifest.get("minSupportedVersionCode") or version_code
          )
          manifest["mandatory"] = bool(manifest.get("mandatory", False))
          # Derived from the repository this run is actually in, so a fork or a
          # rename can never publish a manifest pointing at someone else's APK.
          manifest["apkUrl"] = (
              f"https://github.com/{repo}/releases/download/"
              f"{tag}/keyel-v{version}-universal.apk"
          )

          # The universal APK is what the in-app updater always downloads.
          built = f"dist/keyel-v{version}-universal.apk"
          with open(built, "rb") as fh:
              data = fh.read()
          manifest["size"] = len(data)
          manifest["sha256"] = hashlib.sha256(data).hexdigest()
          manifest["releaseNotes"] = release_notes
          manifest["publishedAt"] = (
              datetime.datetime.now(datetime.timezone.utc).isoformat()
          )
          manifest["channel"] = channel
          manifest["isPrerelease"] = is_prerelease

          with open(manifest_path, "w") as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)
              fh.write("\n")

          # Emit the path + hash so the verification step checks the manifest of
          # the channel that was actually published.
          print(manifest_path)
          print(manifest["sha256"])
          PY

      # The channel manifest's sha256 is only meaningful if it describes the APK
      # that was actually published. A staging mistake or a mangled upload would
      # otherwise ship an update that fails verification on every device.
      - name: Verify published APK matches the ${{ env.KEYEL_CHANNEL }} manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$KEYEL_CHANNEL" == beta ]]; then
            MANIFEST="update_manifest_beta.json"
          else
            MANIFEST="update_manifest.json"
          fi
          local_sha="$(sha256sum "dist/keyel-v${VERSION}-universal.apk" | cut -d' ' -f1)"
          manifest_sha="$(python3 -c \
            "import json;print(json.load(open('$MANIFEST'))['sha256'])")"
          if [[ "$local_sha" != "$manifest_sha" ]]; then
            echo "::error::Manifest sha256 ($manifest_sha) != built APK ($local_sha)"
            exit 1
          fi
          rm -rf /tmp/published-apk
          if ! gh release download "${{ steps.version.outputs.tag }}" \
              --pattern "keyel-v${VERSION}-universal.apk" --dir /tmp/published-apk \
              --clobber >/dev/null 2>&1; then
            echo "::error::Published release is missing the universal APK"
            exit 1
          fi
          published_sha="$(sha256sum "/tmp/published-apk/keyel-v${VERSION}-universal.apk" | cut -d' ' -f1)"
          if [[ "$published_sha" != "$manifest_sha" ]]; then
            echo "::error::Published APK ($published_sha) != manifest sha256 ($manifest_sha)"
            exit 1
          fi
          echo "Verified: published APK matches $MANIFEST ($published_sha)"

      # Only the manifest of the published channel is committed back, with a
      # channel-aware message; the other channel's file is left untouched.
      - name: Commit ${{ env.KEYEL_CHANNEL }} manifest back to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$KEYEL_CHANNEL" == beta ]]; then
            MANIFEST="update_manifest_beta.json"
            LABEL="beta OTA manifest"
          else
            MANIFEST="update_manifest.json"
            LABEL="OTA manifest"
          fi
          if git diff --quiet -- "$MANIFEST"; then
            echo "No $MANIFEST changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST"
            git commit -m "chore(release): update $LABEL for v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi
