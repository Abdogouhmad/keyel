# Keyel core: pure Rust, no flutter_rust_bridge types in here.
# Everything the app does (crypto, vault format, generator, TOTP, health)
# is implemented and tested in this crate, independent of the UI.
[package]
name = "keyel_core"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[lints]
workspace = true

[dependencies]
rand = "0.9"
zeroize = "1.8"
secrecy = "0.10"
thiserror = "2"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
ciborium = "0.2"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.29.1", features = ["v7", "serde"] }
unicode-normalization = "0.1.26"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }

[dev-dependencies]
proptest = "1"
tempfile = "3.27.0"
